<!DOCTYPE html>
<html>
    <head>
        <title>Element sandbox by Kesov Stavros</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            html{
                background-color: #ffffff;
                color:#000000;
            }
            upboard{
                position: fixed;
                width: 100%;
                left:0px;
                top:0px;
                background: #c7c7c7;
            }
            select{
                background-color: #a7a7a7;
            }
        </style>
    </head>
    <body>
        <upboard>
            <label for="objecttype">Particle type</label>
            <select id="objecttype">
                <option value="quark1">U-Quark</option>
                <option value="quark2">C-Quark</option>
                <option value="quark3">T-Quark</option>
                <option value="quark4">D-Quark</option>
                <option value="quark5">S-Quark</option>
                <option value="quark6">B-Quark</option>
                <option value="electron">Electron</option>
                <option value="muon">Muon</option>
                <option value="tau">Tau</option>
                <option value="photon">Photon</option>
                <option value="w">W-Boson</option>
                <option value="z">Z-Boson</option>
                <option value="gluon">Gluon</option>
                <option value="higgs">Higgs boson</option>
            </select>
            <label for="color">Color</label>
            <select id="color">
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
            </select>
        </upboard><br>
        <canvas id="gameframe" width="100%" height="100%"></canvas>
        There will be game in future
        <script>
            var canvobj=document.getElementById("gameframe")
            var ctx=canvobj.getContext("2d")
            var objects={}
            canvobj.addEventListener("click",function(e){
                objects.push({type:document.getElementById("objecttype").value,x:clientX,x:e.clientY})
            })
            ctx.beginPath()
            objects.array.forEach(element => {
                if (element.type=="Photon"){
                    ctx.arc(element.x,element.y,2,0,2*Math.PI)
                }
            });
        </script>
    </body>
</html>
